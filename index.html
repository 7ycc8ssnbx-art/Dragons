<body>
  <main>
    <h1>Reptile Logger</h1>

    <label for="farmer-code">Your farm code</label>
    <input id="farmer-code" placeholder="e.g. FARM01">
    <button id="save-code-btn">Save farm code</button>

    <label for="species">Species (optional)</label>
    <input id="species" placeholder="e.g. eastern water dragon">

    <label for="notes">Notes (optional)</label>
    <textarea id="notes" rows="3" placeholder="Behaviour, habitat, anything interesting..."></textarea>

    <!-- Photo input – wiring to central storage is a separate step -->
    <label for="photo">Photo (optional, not yet uploaded)</label>
    <input id="photo" type="file" accept="image/*">

    <button id="log-btn">Log reptile sighting</button>
    <p id="status"></p>

    <h2>Previous sightings (on this device)</h2>
    <ul id="sightings-list"></ul>

    <button id="export-btn">Export local data (CSV)</button>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
